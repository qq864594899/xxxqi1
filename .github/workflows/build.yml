name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Clone Pikafish
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/Pikafish
          cd /tmp/Pikafish/src
          curl -L -o pikafish.nnue https://github.com/official-pikafish/Pikafish/raw/master/src/pikafish.nnue

      - name: Patch types.h
        run: |
          cd /tmp/Pikafish/src
          printf '#define __SIZEOF_INT128__ 16\nusing u128 = unsigned __int128;\n' > /tmp/h.txt
          cat /tmp/h.txt types.h > types.h.new
          mv types.h.new types.h
          head -5 types.h

      - name: Build Pikafish static lib (iOS)
        run: |
          cd /tmp/Pikafish/src
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          # 强制用 iOS SDK 编译
          sed -i.bak "s|^CXXFLAGS = |CXXFLAGS = -arch arm64 -isysroot $SDK -mios-version-min=15.0 |" Makefile
          sed -i.bak "s|^LDFLAGS = |LDFLAGS = -arch arm64 -isysroot $SDK -mios-version-min=15.0 |" Makefile
          grep -n "CXXFLAGS\|LDFLAGS" Makefile | head -5
          make -j4 build ARCH=apple-silicon
          ar rcs libpikafish.a *.o
          ls -la libpikafish.a
          file attacks.o

      - name: Copy libs into repo
        run: |
          mkdir -p libs
          cp /tmp/Pikafish/src/libpikafish.a libs/
          cp /tmp/Pikafish/src/*.h libs/
          cp -r /tmp/Pikafish/src/nnue libs/
          cp /tmp/Pikafish/src/pikafish.nnue libs/
          ls libs/

      - name: Precompile wrapper
        run: |
          cd libs
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -c pikafish_wrapper.cpp -o pikafish_wrapper.o \
            -I. -std=c++17 -arch arm64 -isysroot "$SDK" \
            -mios-version-min=15.0 -fPIC -DNDEBUG \
            -D__SIZEOF_INT128__=16
          ls -la pikafish_wrapper.o

      - name: Copy NNUE into layout
        run: |
          mkdir -p layout/var/mobile/xiangqiassist
          cp /tmp/Pikafish/src/pikafish.nnue layout/var/mobile/xiangqiassist/
          ls -la layout/var/mobile/xiangqiassist/

      - name: Build Tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
